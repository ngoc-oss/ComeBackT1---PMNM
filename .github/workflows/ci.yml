name: Validate FreshCheck
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ml scripts tests
      - run: python scripts/verify_release.py

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept licenses and install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate and build Android app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FreshCheck-0.5.0-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
